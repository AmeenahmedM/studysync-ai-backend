spring:
  application:
    name: studysync-ai-backend

  datasource:
    url: jdbc:mysql://localhost:3306/studysync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: studysync
    password: studysync
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        globally_quoted_identifiers: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${JWT_SECRET:studysync-super-secret-key-change-in-production}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:demo-key}
    timeout-ms: ${AI_TIMEOUT_MS:30000}
    max-retries: ${AI_MAX_RETRIES:3}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.studysync.controller

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
